version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-pac_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pac_mcmv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pac_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile.prod
    ports:
      - "${APP_PORT:-80}:8501"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-pac_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-pac_mcmv}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

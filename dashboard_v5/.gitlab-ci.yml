# GitLab CI/CD Pipeline for MCMV Dashboard v5

stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: ${CI_REGISTRY}
  API_IMAGE: ${CI_REGISTRY_IMAGE}/api
  FRONTEND_IMAGE: ${CI_REGISTRY_IMAGE}/frontend
  NGINX_IMAGE: ${CI_REGISTRY_IMAGE}/nginx

# Build stage
build-api:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - cd dashboard_v5/backend
    - docker build -f Dockerfile.prod -t ${API_IMAGE}:${CI_COMMIT_SHA} .
    - docker tag ${API_IMAGE}:${CI_COMMIT_SHA} ${API_IMAGE}:latest
    - docker push ${API_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${API_IMAGE}:latest
  only:
    - main
    - develop

build-frontend:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - cd dashboard_v5/frontend
    - docker build -f Dockerfile.prod -t ${FRONTEND_IMAGE}:${CI_COMMIT_SHA} .
    - docker tag ${FRONTEND_IMAGE}:${CI_COMMIT_SHA} ${FRONTEND_IMAGE}:latest
    - docker push ${FRONTEND_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${FRONTEND_IMAGE}:latest
  only:
    - main
    - develop

# Test stage
test-api:
  stage: test
  image: python:3.11-slim
  services:
    - postgres:15
    - redis:7-alpine
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/test_db
    REDIS_HOST: redis
  before_script:
    - cd dashboard_v5/backend
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-asyncio
  script:
    - pytest --cov=app tests/
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    - merge_requests
    - main
    - develop

lint-frontend:
  stage: test
  image: node:18-alpine
  before_script:
    - cd dashboard_v5/frontend
    - npm ci
  script:
    - npm run lint
    - npm run type-check
  only:
    - merge_requests
    - main
    - develop

# Deploy stage
deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl docker-compose
  script:
    - echo "Deploying to staging environment"
    - docker-compose -f dashboard_v5/docker-compose.prod.yml pull
    - docker-compose -f dashboard_v5/docker-compose.prod.yml up -d
  environment:
    name: staging
    url: https://staging.mcmv-dashboard.com
  only:
    - develop

deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl docker-compose
  script:
    - echo "Deploying to production environment"
    - docker-compose -f dashboard_v5/docker-compose.prod.yml pull
    - docker-compose -f dashboard_v5/docker-compose.prod.yml up -d
  environment:
    name: production
    url: https://mcmv-dashboard.com
  when: manual
  only:
    - main

# Health check after deployment
.health-check:
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for i in $(seq 1 30); do
        if curl -f ${APP_URL}/health; then
          echo "Application is healthy"
          exit 0
        fi
        echo "Waiting for application to be ready..."
        sleep 10
      done
      echo "Application failed to become healthy"
      exit 1

health-check-staging:
  extends: .health-check
  stage: deploy
  variables:
    APP_URL: https://staging.mcmv-dashboard.com
  needs: ["deploy-staging"]
  only:
    - develop

health-check-production:
  extends: .health-check
  stage: deploy
  variables:
    APP_URL: https://mcmv-dashboard.com
  needs: ["deploy-production"]
  only:
    - main
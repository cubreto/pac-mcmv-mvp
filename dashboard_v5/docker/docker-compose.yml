# MCMV Dashboard v5 - Production-Ready Docker Compose
# High-performance architecture with Redis caching and monitoring

version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mcmv-v5-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=pac_mcmv
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_DEBUG=false
      - LOG_LEVEL=INFO
    depends_on:
      - database
      - redis
    volumes:
      - ../config:/app/config:ro
    networks:
      - mcmv-v5-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend (nginx-served production build)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mcmv-v5-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - mcmv-v5-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (reuse existing)
  database:
    image: postgres:15-alpine
    container_name: mcmv-v5-database
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    environment:
      - POSTGRES_DB=pac_mcmv
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - mcmv_v5_postgres_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro
    networks:
      - mcmv-v5-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mcmv-v5-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - mcmv_v5_redis_data:/data
    networks:
      - mcmv-v5-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy & Load Balancer
  proxy:
    image: nginx:alpine
    container_name: mcmv-v5-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - mcmv-v5-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: mcmv-v5-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mcmv_v5_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - mcmv-v5-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: mcmv-v5-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - mcmv_v5_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - mcmv-v5-network
    restart: unless-stopped

volumes:
  mcmv_v5_postgres_data:
    driver: local
  mcmv_v5_redis_data:
    driver: local
  mcmv_v5_prometheus_data:
    driver: local
  mcmv_v5_grafana_data:
    driver: local

networks:
  mcmv-v5-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
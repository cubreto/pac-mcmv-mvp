services:
  db:
    image: postgres:15
    container_name: pac-mcmv-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pac_mcmv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
